services:
  database:
    image: postgres:latest
    env_file:
      - cmd/server/.env
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "postgres", "-U", "postgres"]
      timeout: 45s
      interval: 10s
      retries: 10
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - ./scripts/database:/docker-entrypoint-initdb.d
      - db:/var/lib/postgresql/data
    environment:
      POSTGRES_HOST: ${DB_HOST}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_MULTIPLE_DATABASE: '${DB_NAME}_test'
    networks:
      - app-network
  server:
    build: .
    env_file:
      - cmd/server/.env
    depends_on:
      - database
    volumes:
      - .:/app
    ports:
      - "${WEB_SERVER_PORT}:${WEB_SERVER_PORT}"
    networks:
      - app-network

volumes:
  db:

networks:
  app-network:
    driver: bridge
